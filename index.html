<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Запоминание последовательностей</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050a0e;
      --bg2: #0a1520;
      --panel: #0d1f2d;
      --border: #1a3a4a;
      --accent: #00e5ff;
      --accent2: #00ff88;
      --warn: #ff4560;
      --text: #c8e6f0;
      --text-dim: #4a7a90;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 16px 48px;
    }
    .app {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      text-align: center;
      padding: 16px 0 8px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-family: 'Orbitron', monospace;
      font-size: clamp(12px, 3.5vw, 18px);
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--accent);
      line-height: 1.4;
    }
    .header p {
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 8px;
      text-align: center;
    }
    .stat-label {
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 5px;
    }
    .stat-value {
      font-family: 'Orbitron', monospace;
      font-size: 26px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    .stat-value.green { color: var(--accent2); }
    .status {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 16px;
      text-align: center;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      transition: color .3s, border-color .3s;
    }
    .status.watch { color: var(--accent); border-color: var(--accent); }
    .status.play  { color: var(--accent2); border-color: var(--accent2); }
    .status.err   { color: var(--warn); border-color: var(--warn); }
    .grid-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 360px;
    }
    .cell {
      aspect-ratio: 1;
      background: #111e2b;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: 'Orbitron', monospace;
      font-size: clamp(14px, 4vw, 22px);
      font-weight: 700;
      color: var(--text-dim);
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .cell:hover:not(:disabled) { border-color: rgba(0,229,255,.4); color: var(--text); }
    .cell:active:not(:disabled) { transform: scale(.95); }
    .cell.flash {
      background: var(--accent);
      border-color: var(--accent);
      color: #050a0e;
      transform: scale(1.06);
    }
    .cell.hit { background: var(--accent2); border-color: var(--accent2); color: #050a0e; }
    .cell.miss {
      background: var(--warn);
      border-color: var(--warn);
      color: #fff;
      animation: shake .35s ease;
    }
    .cell:disabled { cursor: not-allowed; opacity: .55; }
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-6px)}40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)}80%{transform:translateX(4px)}
    }
    .dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; min-height: 16px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: all .2s; }
    .dot.done { background: var(--accent2); transform: scale(1.2); }
    .dot.cur  { background: var(--accent); transform: scale(1.3); animation: pdot .8s infinite; }
    @keyframes pdot { 0%,100%{opacity:1}50%{opacity:.4} }
    .controls { display: flex; gap: 10px; justify-content: center; }
    .btn {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 13px 24px;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
      color: var(--text-dim);
      transition: all .2s;
    }
    .btn:hover { color: var(--text); border-color: var(--text-dim); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { border-color: var(--accent); color: var(--accent); }
    .btn-primary:hover { background: rgba(0,229,255,.08); }
    .history {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .hist-title {
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 12px;
    }
    .hist-empty { text-align: center; color: var(--text-dim); font-size: 13px; padding: 10px 0; }
    .hist-list { list-style: none; display: flex; flex-direction: column; gap: 5px; max-height: 180px; overflow-y: auto; }
    .hist-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      background: var(--bg2);
      border-radius: 5px;
      font-size: 13px;
      border-left: 2px solid transparent;
    }
    .hist-item.best { border-left-color: var(--accent2); }
    .hist-num { color: var(--text-dim); font-size: 11px; }
    .hist-score { color: var(--accent); font-family: 'Orbitron', monospace; font-size: 13px; }
    .hist-item.best .hist-score { color: var(--accent2); }
    .hist-badge {
      font-size: 9px;
      letter-spacing: .1em;
      color: var(--accent2);
      border: 1px solid var(--accent2);
      padding: 2px 5px;
      border-radius: 3px;
    }
    /* MODAL */
    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(5,10,14,.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      animation: fadein .3s ease;
    }
    .modal-bg.hidden { display: none; }
    .modal-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px 28px;
      text-align: center;
      max-width: 300px;
      width: 90%;
    }
    .modal-label { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px; }
    .modal-score {
      font-family: 'Orbitron', monospace;
      font-size: 68px;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 6px;
    }
    .modal-score.rec { color: var(--accent2); }
    .modal-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 26px; }
    @keyframes fadein { from{opacity:0} to{opacity:1} }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Запоминание последовательностей</h1>
    <p>Тераз Р.В. · ООП · ОмГУПС 2026</p>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Уровень</div><div class="stat-value" id="s-lv">—</div></div>
    <div class="stat"><div class="stat-label">Длина</div><div class="stat-value" id="s-len">—</div></div>
    <div class="stat"><div class="stat-label">Рекорд</div><div class="stat-value green" id="s-rec">0</div></div>
  </div>

  <div class="status" id="status">— нажмите СТАРТ —</div>

  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
    <div class="dots" id="dots"></div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="btn-start">▶ Старт</button>
    <button class="btn" id="btn-clear" style="display:none">Сбросить</button>
  </div>

  <div class="history">
    <div class="hist-title">История попыток</div>
    <div class="hist-empty" id="hist-empty">Нет сыгранных партий</div>
    <ul class="hist-list" id="hist-list"></ul>
  </div>
</div>

<div class="modal-bg hidden" id="modal">
  <div class="modal-card">
    <div class="modal-label">Игра окончена</div>
    <div class="modal-score" id="m-score">0</div>
    <div class="modal-sub" id="m-sub"></div>
    <div class="controls">
      <button class="btn btn-primary" id="btn-restart">▶ Играть снова</button>
    </div>
  </div>
</div>

<script>
  const SIZE = 9;
  let seq = [], input = [], level = 0, isUserTurn = false;
  let maxScore = Number(localStorage.getItem('sgMax')) || 0;
  let history = [];
  try { history = JSON.parse(localStorage.getItem('sgHist') || '[]'); } catch(e){}

  // Build grid
  const gridEl = document.getElementById('grid');
  for (let i = 0; i < SIZE; i++) {
    const b = document.createElement('button');
    b.className = 'cell';
    b.textContent = i + 1;
    b.addEventListener('click', () => onCell(i));
    gridEl.appendChild(b);
  }

  function getCells() { return Array.from(gridEl.querySelectorAll('.cell')); }

  function setStatus(msg, cls) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + (cls || '');
  }

  function updateStats() {
    document.getElementById('s-lv').textContent  = level  || '—';
    document.getElementById('s-len').textContent = seq.length || '—';
    document.getElementById('s-rec').textContent = maxScore;
  }

  function renderDots() {
    const el = document.getElementById('dots');
    if (!isUserTurn || !seq.length) { el.innerHTML = ''; return; }
    el.innerHTML = seq.map((_, i) =>
      `<div class="dot ${i < input.length ? 'done' : i === input.length ? 'cur' : ''}"></div>`
    ).join('');
  }

  function renderHistory() {
    const list  = document.getElementById('hist-list');
    const empty = document.getElementById('hist-empty');
    const clr   = document.getElementById('btn-clear');
    if (!history.length) { empty.style.display = ''; list.innerHTML = ''; clr.style.display = 'none'; return; }
    empty.style.display = 'none';
    clr.style.display = '';
    list.innerHTML = [...history].reverse().map((s, ri) => {
      const num  = history.length - ri;
      const best = s === maxScore && maxScore > 0;
      return `<li class="hist-item ${best ? 'best' : ''}">
        <span class="hist-num">#${num}</span>
        <span class="hist-score">${s} уровн.</span>
        ${best ? '<span class="hist-badge">РЕКОРД</span>' : ''}
      </li>`;
    }).join('');
  }

  function rand() { return Math.floor(Math.random() * SIZE); }
  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function playSeq(s) {
    isUserTurn = false;
    setStatus('◈ запоминайте последовательность', 'watch');
    getCells().forEach(c => c.disabled = true);
    await wait(400);
    for (const idx of s) {
      const c = getCells()[idx];
      c.classList.add('flash'); await wait(560);
      c.classList.remove('flash'); await wait(220);
    }
    isUserTurn = true;
    setStatus('▶ ваш ход — повторите', 'play');
    getCells().forEach(c => c.disabled = false);
    renderDots();
  }

  async function startGame() {
    document.getElementById('modal').classList.add('hidden');
    seq = [rand()]; input = []; level = 1;
    updateStats(); renderDots();
    await playSeq(seq);
  }

  async function nextLevel() {
    setStatus('✓ верно!', 'play');
    await wait(500);
    seq = [...seq, rand()]; input = []; level = seq.length;
    updateStats(); renderDots();
    await playSeq(seq);
  }

  function endGame() {
    const score = level - 1;
    isUserTurn = false;
    getCells().forEach(c => c.disabled = true);
    setStatus('✗ игра окончена', 'err');

    const newHist = [...history, score];
    history = newHist;
    localStorage.setItem('sgHist', JSON.stringify(newHist));

    const isRec = score > maxScore;
    if (isRec) { maxScore = score; localStorage.setItem('sgMax', String(score)); }
    updateStats(); renderHistory();

    document.getElementById('m-score').textContent = score;
    document.getElementById('m-score').className = 'modal-score' + (isRec ? ' rec' : '');
    document.getElementById('m-sub').textContent = isRec
      ? '🏆 Новый рекорд!'
      : `Рекорд: ${maxScore}`;

    setTimeout(() => document.getElementById('modal').classList.remove('hidden'), 700);
  }

  async function onCell(idx) {
    if (!isUserTurn) return;
    const newInput = [...input, idx];
    input = newInput;
    const pos = newInput.length - 1;
    const cell = getCells()[idx];
    if (seq[pos] !== idx) {
      cell.classList.add('miss');
      setTimeout(() => cell.classList.remove('miss'), 400);
      endGame(); return;
    }
    cell.classList.add('hit');
    setTimeout(() => cell.classList.remove('hit'), 300);
    renderDots();
    if (newInput.length === seq.length) { await wait(300); nextLevel(); }
  }

  document.getElementById('btn-start').addEventListener('click', startGame);
  document.getElementById('btn-restart').addEventListener('click', startGame);
  document.getElementById('btn-clear').addEventListener('click', () => {
    history = []; maxScore = 0;
    localStorage.removeItem('sgHist'); localStorage.removeItem('sgMax');
    updateStats(); renderHistory();
  });

  updateStats();
  renderHistory();
</script>
</body>
</html>
